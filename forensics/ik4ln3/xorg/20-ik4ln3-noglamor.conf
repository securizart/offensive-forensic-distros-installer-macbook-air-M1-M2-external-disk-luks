# iK4lN3 — Apple Silicon (agx) + Xorg fix.
# MATE runs on Xorg (unlike the Wayland-based GNOME base). On Apple Silicon
# the AGX GPU is a separate render node from the display controller, so
# Xorg's modesetting gets no hardware GL and the mesa software DRI driver
# (swrast) is missing/mismatched here — which makes BOTH glamor and the GLX
# extension crash the X server (segfault during GLX/AIGLX init).
# Fix: disable glamor AND the GLX extension. The 2D MATE desktop renders
# fine via the framebuffer; only OpenGL-under-X apps lose acceleration,
# which is irrelevant for a forensic desktop.
Section "Device"
    Identifier "ik4ln3-modeset"
    Driver "modesetting"
    Option "AccelMethod" "none"
EndSection

Section "Module"
    Disable "glamoregl"
EndSection

Section "Extensions"
    Option "GLX" "Disable"
EndSection
